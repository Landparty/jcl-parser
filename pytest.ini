[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=jclparser
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=87
markers =
    integration: Integration tests that test multiple components together
    contract: Contract tests that validate API specifications  
    unit: Unit tests that test individual functions or classes
    performance: Performance tests that validate speed and memory usage
    slow: Tests that take longer than usual to run
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning