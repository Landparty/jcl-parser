name: release-please

on:
  push:
    branches:
      - main
  # Manual dry run of the wheel-build + publish path. PyPI filenames are
  # burned permanently on first upload, so `target: testpypi` exists to
  # rehearse the whole pipeline against test.pypi.org before the first real
  # publish. Using it requires a SEPARATE one-time manual step -- registering
  # a Trusted Publisher for this repo/workflow on test.pypi.org, exactly like
  # the pypi.org registration noted on publish-pypi below.
  workflow_dispatch:
    inputs:
      target:
        description: "Package index the publish-pypi job uploads to"
        type: choice
        options:
          - pypi
          - testpypi
        # Defaults to the safe rehearsal target -- an accidental dispatch
        # (e.g. clicking "Run workflow" without touching the dropdown) must
        # not publish to the live index. Choose "pypi" explicitly.
        default: testpypi

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # `releases_created` is the aggregate flag for manifest mode: true on the
      # run where the "chore: release X" PR is merged and the release is cut.
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # GITHUB_TOKEN works out of the box. Releases it creates do NOT
          # trigger other workflows -- that's why the publish job below lives
          # in THIS same workflow (gated on the output) instead of a separate
          # release-triggered workflow, which would never fire.
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build the distributions and attach them to the GitHub Release that
  # release-please just created. Only runs when a release was actually cut
  # (release PR merged), not when the release PR is merely opened/updated.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Resolve the release tag from the manifest
        id: tag
        # The merge commit that triggered this run already bumped the manifest
        # to the released version; tags use the v<version> format
        # (include-component-in-tag: false).
        run: echo "tag=v$(jq -r '.["."]' .release-please-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Attach distributions to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" dist/* --clobber

  # Publish the sdist and wheel to PyPI via Trusted Publishing (OIDC) -- no
  # stored API token/secret. Requires a one-time manual step on pypi.org
  # registering this repo/workflow as a trusted publisher for the
  # "jclparser" project, plus a "pypi" GitHub Environment configured on the
  # repo (see the cobol-parser sibling repo's release-please.yml for the
  # equivalent setup this mirrors).
  publish-pypi:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # NOTE: the environment stays "pypi" even for a testpypi dry run -- the
    # deployment gate/reviewers are the same either way, and splitting it
    # would need a second environment configured by hand. Only the upload URL
    # below changes.
    environment:
      name: pypi
      url: https://pypi.org/project/jclparser/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Re-running this job after a partial upload would otherwise fail on
          # the files that already landed. PyPI filenames are immutable, so
          # skipping them is the only recoverable behavior.
          skip-existing: true
          repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
