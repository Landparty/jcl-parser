[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jcl-parser"
version = "1.3.0"
description = "Parse IBM JCL (Job Control Language) scripts into Python objects"
authors = [
    {name = "JCL Parser Team", email = "team@jclparser.dev"}
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
]
keywords = ["jcl", "mainframe", "parser", "ibm", "job-control-language"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "coverage[toml]>=7.0",
    "pytest-cov>=4.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "tomli>=1.1.0; python_version < '3.11'",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "tomli>=1.1.0; python_version < '3.11'",
]
profiling = ["psutil>=5.9"]

[project.scripts]
jcl-parser = "jclparser.cli:main"

[project.urls]
Homepage = "https://github.com/landparty/jcl-parser"
Repository = "https://github.com/landparty/jcl-parser"
Documentation = "https://github.com/landparty/jcl-parser/tree/main/docs"
"Bug Reports" = "https://github.com/landparty/jcl-parser/issues"

[tool.setuptools.packages.find]
include = ["jclparser*"]

[tool.setuptools.package-data]
jclparser = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=jclparser",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=90",
]
markers = [
    "integration: Integration tests that test multiple components together",
    "contract: Contract tests that validate API specifications",
    "unit: Unit tests that test individual functions or classes",
    "performance: Performance tests that validate speed and memory usage",
    "slow: Tests that take longer than usual to run",
    "benchmark: Benchmark tests for performance tracking",
]
norecursedirs = ["tests/benchmarks"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["jclparser"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2
fail_under = 90.0

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true